        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r 10-vichy-mineral89/requirements.txt
      - name: Run analysis
        run: |
          cd 10-vichy-mineral89
          python analysis.py
        env:
          MPLBACKEND: Agg
